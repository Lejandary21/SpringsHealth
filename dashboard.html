<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringsHealth</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <h2>SpringsHealth</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html" id="nav-dashboard" class="active">Dashboard</a></li>
                    <li><a href="patient.html" id="nav-patients">Patient Management</a></li>
                    <li><a href="Placeholder">Data Forms</a></li>
                    <li><a href="Placeholder">Settings</a></li>
                    <li><a href="Placeholder">Help</a></li>
                </ul>
            </nav>
            <button id="logout-btn">Log Out</button>
        </aside>

        <main class="main-content">
            <header>
    <h1>Dashboard Overview</h1>
    
    <div class="user-profile">
        
        <div class="user-avatar">
            <img src="profilepicnew.png" alt="Profile">
        </div>
        <span class="user-name">Anon Nurse Admin</span>
    </div>
</header>

            <section class="data-section">
                <h2>Student Medical Records</h2>
                <table id="medical-data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Year</th>
                            <th>Age</th>
                            <th>Sickness/Status</th>
                            <th>Allergies</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="5" class="loading-text">No data loaded yet...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
