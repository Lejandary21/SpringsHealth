<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management - SpringsHealth</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <h2>SpringsHealth</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html" id="nav-dashboard">Dashboard</a></li>
                    <li><a href="patient.html" id="nav-patients" class="active">Patient Management</a></li>
                    <li><a href="data-forms.html" id="nav-data-forms">Data Forms</a></li>
                    <li><a href="settings.html" id="nav-settings">Settings</a></li>
                    <li><a href="help.html" id="nav-help">Help & Support</a></li>
                </ul>
            </nav>
            <button id="logout-btn">Log Out</button>
        </aside>

        <main class="main-content">
            <header>
                <h1>Patient Management</h1>
                <div class="user-profile">
                    <div class="user-avatar">
                        <img src="profilepicnew.png" alt="Profile">
                    </div>
                    <span class="user-name">Anon Nurse Admin</span>
                </div>
            </header>

            <div style = "display: flex; justify-content: flex-end; margin-bottom: 15px;">
                <button id="edit-table-btn" class="secondary-btn" onclick="toggleEditMode()"> Edit Patients</button>
            </div>

        
            <section class="table-container settings-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Year Level</th>
                            <th>Age</th>
                            <th>Medical Conditions</th>
                            <th>Emergency Contact</th>
                        </tr>
                    </thead>
                    <tbody id="patient-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <div id="patient-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content settings-card">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <div class="modal-header">
            <h2 id="modal-name">Student Name</h2>
        </div>
        
        <div class="modal-body">
            <p><strong>Year Level:</strong> <span id="modal-year"></span></p>
            <p><strong>Age:</strong> <span id="modal-age"></span></p>
            <p><strong>Conditions/Allergies:</strong> <span id="modal-conditions"></span></p>
           
            <div class="info-block">
                <h3>Emergency Contact</h3>
                <p><span id="modal-contact"></span></p>
            </div>
        </div>
        
        <button class="primary-btn" style="width: 100%; margin-top: 15px;">View Full Action Plan</button>
    </div>
</div>

    <script src="app.js"></script>
</body>
</html>
